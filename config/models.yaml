# 模型API配置 - 纯连接参数，按厂商分类
models:
  openai_gpt4o:
    provider: openai
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    model: gpt-4o
    default_temperature: 0.2
    max_tokens: 4096

  gemini_pro:
    provider: gemini
    api_key: ${GEMINI_API_KEY}
    model: gemini-1.5-pro-latest
    default_temperature: 0.3
    max_tokens: 8192

  anthropic_claude:
    provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-3-5-sonnet-20241022
    default_temperature: 0.2
    max_tokens: 4096

  seed_doubao:
    provider: doubao
    api_key: ${ARK_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: doubao-seed-2-0-pro-260215
    default_temperature: 0.3
    timeout: 120

  qwen_max:
    provider: openai_compatible
    api_key: ${DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-max
    default_temperature: 0.2

  # ── DeepSeek 系列（OpenAI 兼容协议）──
  # v4 系列：deepseek-v4-flash（轻量）/ deepseek-v4-pro（旗舰，支持思考模式）
  # 旧版 deepseek-chat / deepseek-reasoner 将于 2026/07/24 弃用
  #
  # 重试策略（借鉴 nanobot）：max_retries 是 SDK 级重试，只对超时/限流/5xx 生效，
  # 4xx 直接抛出；不再叠加 LangChain with_retry（需要时加 outer_retry: true）。
  # 思考模式下 reasoning_content 与正文共用 max_tokens，设得太小会把 COA 截断。
  deepseek_v4_flash:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    default_temperature: 0.3
    timeout: 180
    max_retries: 2
    max_tokens: 16384
    fallback_model_ids: ["deepseek_v4_pro"]

  deepseek_v4_pro:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    default_temperature: 0.3
    timeout: 600
    max_retries: 2
    max_tokens: 32768
    # 通过 extra_body 开启思考模式（仅 deepseek-v4-pro 支持）
    extra_body:
      thinking:
        type: enabled
    # 可用 DEEPSEEK_REASONING_EFFORT=medium/low 进一步提速
    reasoning_effort: ${DEEPSEEK_REASONING_EFFORT:high}

  # v4-pro 关闭思考：balanced 档 planner 默认用它。
  # scenario_1_rich 实测（同一份 analyst 输出，单样本）：
  #   high 思考 241s / medium 196s / low 109s / 不思考 70s，
  #   judge 评分 7.2~7.4 无可测差异，结构检查全部通过；不思考版编队编号与任务一致。
  # 需要深度思考时用 --profile quality（planner 回到 deepseek_v4_pro）。
  deepseek_v4_pro_nothink:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    default_temperature: 0.3
    timeout: 300
    max_retries: 2
    max_tokens: 16384
    extra_body:
      thinking:
        type: disabled
    fallback_model_ids: ["deepseek_chat"]

  # 兼容旧名（2026/07/24 弃用，自动指向 v4-flash 的非思考 / 思考模式）
  # 非思考模式，响应快，适合 analyst / judge 这类结构化抽取与打分任务
  deepseek_chat:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-chat
    default_temperature: 0.3
    timeout: 180
    max_retries: 2
    max_tokens: 16384

  # ReAct / 多轮 tool-calling 专用 Alias —— 关键：新名 deepseek-v4-flash
  # 会在响应里带 reasoning_content，下一轮必须原样回传，否则报 400
  # "reasoning_content in the thinking mode must be passed back to the API"。
  # LangChain ChatOpenAI 目前不会自动回传这个 provider-private 字段，
  # 所以所有多轮循环的 Agent（Researcher ReAct、Planner 自我修正等）
  # 必须用旧名 deepseek-chat —— 旧名的响应体只有 role+content，没有 reasoning_content，
  # 天然避开了"回传 reasoning"的陷阱。底层仍然路由到 v4-flash，速度 / 价格不变。
  # 已实测：httpx 直接打 v4-flash 返回 ['role','content','reasoning_content']；
  #        打 deepseek-chat 返回 ['role','content']，与 OpenAI 协议完全一致。
  deepseek_chat_safe:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-chat
    default_temperature: 0.3
    timeout: 120
    max_retries: 2
    max_tokens: 8192
    # 注意：不配 fallback_model_ids —— 一旦 fallback 到 v4-flash/v4-pro 就会
    # 重新引入 reasoning_content 问题。宁可失败也不要隐式切换。

  deepseek_reasoner:
    provider: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    default_temperature: 0.6

  local_qwen:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5:72b
    api_key: "ollama"
    default_temperature: 0.4

# 嵌入模型配置
embeddings:
  openai_emb:
    provider: openai
    api_key: ${OPENAI_API_KEY}
    model: text-embedding-3-large
    dimensions: 3072
    
  dashscope_emb:
    provider: dashscope
    api_key: ${DASHSCOPE_API_KEY}
    model: text-embedding-v2
    dimensions: 1536